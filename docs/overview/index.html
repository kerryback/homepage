<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:#00205B; --gold:#b8912f; --ink:#1a1a1a; --gray:#444; --mut:#6b6b6b; --line:#e4e4e4;
}
body {
  background: #fff; color: var(--ink);
  font-family: "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 32px 16px 40px; }

.eyebrow {
  text-align: center; font-size: 14px; letter-spacing: 3.5px; text-transform: uppercase;

}
.display {
  text-align: center; font-family: Georgia, "Times New Roman", serif;
  font-size: 40px; line-height: 1.12; color: var(--navy); font-weight: 700;
}
.subtitle { text-align: center; font-size: 18px; color: #555; margin-top: 8px; }

.rule {
  height: 3px; border-radius: 2px; margin: 22px 0;
  background: linear-gradient(90deg, var(--navy) 0 62%, var(--gold) 62% 100%);
}

video {
  width: 100%; height: auto; display: block;
  border-radius: 8px; border: 1px solid var(--line); background: #000;
}

.meta {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 14px;
  margin-top: 14px; font-size: 15px; color: var(--mut);
}
.meta .dot { color: var(--gold); font-weight: 700; }

.actions {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 26px;
}
.btn {
  display: inline-block; font-size: 16px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; text-decoration: none; padding: 12px 28px; border-radius: 6px;
  transition: background 0.15s, color 0.15s;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover, .btn-primary:focus { background: #003087; }
.btn-ghost { background: #fff; color: var(--navy); border: 2px solid var(--navy); }
.btn-ghost:hover, .btn-ghost:focus { background: var(--navy); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.foot {
  margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 15px; color: var(--mut);
}
.foot a { color: var(--navy); font-weight: 700; text-decoration: none; }
.foot a:hover { text-decoration: underline; }

@media (max-width: 600px) {
  .display { font-size: 27px; }
  .subtitle { font-size: 16px; }
  .btn { padding: 11px 20px; font-size: 15px; }
}
